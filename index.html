<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Block Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-app">
        <header class="game-info">
            <div class="logo-container">
                <div class="crown-icon">👑</div>
                <h1 class="main-title">BLOCK<br>PUZZLE</h1>
            </div>
            <div class="stats-grid">
                <div class="stat-box current">
                    <span class="label">النقاط</span>
                    <span id="score">0</span>
                </div>
                <div class="stat-box best">
                    <span class="label">أفضل نتيجة</span>
                    <span id="high-score">1950</span>
                </div>
            </div>
        </header>

        <div class="canvas-holder">
            <canvas id="gameBoard"></canvas>
        </div>

        <div id="piece-tray" class="tray">
            </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
